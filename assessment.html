<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progres Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #ffffff;}
        .card-bg { background-color: #fdfaf3;}
        .text-maroon { color: #7A1315;}
        .bg-maroon { background-color: #7A1315;}
    </style>
</head>
<body class="p-10 flex justify-center items-center min-h-screen">
    <div class="max-w-4xl w-full">
        <div class="flex items-center mb-10">
            <div class="w-1.5 h-8 bg-yellow-400 mr-4 rounded-sm"></div>
            <h1 class="text-3xl font-bold text-maroon">Progres Assessment</h1>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-16">

            <div class="card-bg rounded-2xl p-8 flex flex-col items-center text-center shadow-sm hover:shadow-md transition-shadow border border-yellow-50/50">
                <i class="fa-solid fa-vial text-4xl text-maroon mb-4"></i>
                <h2 class="text-xl font-bold text-maroon mb-2">Eksplorasi Diri</h2>
                <p class="text-gray-600 text-sm">Uji minat, Bakat, dan Kepribadian anda secara objektif.</p>
            </div>

            <div class="card-bg rounded-2xl p-8 flex flex-col items-center text-center shadow-sm hover:shadow-md transition-shadow border border-yellow-50/50">
                <i class="fa-solid fa-book-open text-4xl text-maroon mb-4"></i>
                <h2 class="text-xl font-bold text-maroon mb-2">Mata Pelajaran Favorit</h2>
                <p class="text-gray-600 text-sm">Tentukan dan urutkan mata pelajaran yang paling anda minati.</p>
            </div>
        </div>

        <div class="w-full max-w-lg mx-auto">

            <div class="relative px-2">
                <div class="absolute top-1/2 left-0 right-0 h-2 -translate-y-1/2 bg-gray-300 z-0"></div>

                <div class="absolute top-1/2 left-0 w-1/2 h-2 -translate-y-1/2 bg-maroon z-0"></div>

                <div class="relative z-10 flex justify-between items-center w-full">
                    
                    <div class="w-10 h-10 rounded-full bg-maroon flex items-center justify-center text-white ring-8 ring-white shadow-sm">
                        <i class="fa-solid fa-check text-base"></i>
                    </div>

                    <div class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center text-white ring-8 ring-white shadow-sm">
                        <i class="fa-solid fa-check text-base"></i>
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-start w-full mt-4 text-sm font-bold">
                <div class="text-center w-32 -ml-11 text-maroon">
                    Eksplorasi Diri <br><span class="text-xs text-gray-500 font-normal">Selesai</span>
                </div>
                <div class="text-center w-40 -mr-16 text-gray-400">
                    Mata Pelajaran Favorit <br><span class="text-xs font-normal">Belum Selesai</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
