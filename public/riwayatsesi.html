<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Planner - Riwayat Sesi & Progres Karir</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            background-color: #fcfcfc;
            min-height: 100vh;
            color: #333;
        }

        /* --- SIDEBAR STYLE (Tema Match Major) --- */
        .sidebar {
            width: 280px;
            background-color: #800000; /* Merah Marun */
            color: white;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

       /* --- STYLING LOGO UTAMA --- */
        .logo-text {
            line-height: 0.95; /* Mengatur jarak vertikal antar baris agar rapat */
        }

        .logo-text .title-match {
            color: #FFFFFF; /* Warna Putih */
            font-size: 42px;
            font-weight: 900; /* Tebal maksimal */
            font-style: bold; 
            letter-spacing: 0.5px;
            display: block;
        }

        .logo-text .Career Planner {
            color: #FFEA00; /* Warna Kuning Terang */
            font-size: 34px;
            font-weight: 600;
            font-style: italic; 
            display: block;
            margin-top: 5px;
        }

        .logo-area span {
            color: #ffd700; /* Kuning */
        }

        .nav-links {
            margin-top: 50px;
            list-style: none;
            flex-grow: 1;
        }

        .nav-links li {
            margin-bottom: 15px;
        }

        .nav-links a {
            display: block;
            color: #f1f1f1;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-links a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Class Active yang akan berpindah menggunakan JavaScript */
        .nav-links a.active {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffd700;
            font-weight: bold;
        }

        .user-area {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 20px;
        }

        .user-area p {
            font-size: 14px;
            margin-bottom: 4px;
            font-weight: bold;
        }
        
        .user-area span {
            font-size: 12px;
            color: #ccc;
            display: block;
            margin-bottom: 10px;
        }

        .btn-logout {
            background-color: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 6px 15px;
            cursor: pointer;
            font-size: 13px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .btn-logout:hover {
            background-color: white;
            color: #800000;
        }

        /* --- MAIN CONTENT AREA --- */
        .main-content {
            margin-left: 280px;
            padding: 40px 50px;
            width: calc(100% - 280px);
        }

        /* Menyembunyikan halaman yang tidak aktif secara default */
        .page-section {
            display: none;
        }

        /* Menampilkan halaman yang aktif */
        .page-section.active-page {
            display: block;
        }

        /* Top Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .top-bar h2 {
            color: #800000;
            font-size: 24px;
        }

        .spk-badge {
            background-color: #f0f0f0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }

        /* Grid Ringkasan / Kartu Statis */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 20px;
            position: relative;
        }

        .stat-card .icon {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .stat-card .label {
            font-size: 13px;
            color: #888;
        }

        .stat-card .value {
            font-size: 26px;
            font-weight: bold;
            color: #111;
            margin: 5px 0;
        }

        .stat-card .subtext {
            font-size: 11px;
            color: #aaa;
        }

        .badge-up {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #e6f7ed;
            color: #28a745;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .full-width-card {
            background: white;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        /* Filter & Control Bar */
        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: white;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid #eaeaea;
        }

        .filters {
            display: flex;
            gap: 10px;
        }

        .btn-filter {
            background: white;
            border: 1px solid #ddd;
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            color: #555;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #ddd;
            background: #fff;
        }

        .btn-action.active {
            background: #800000;
            color: white;
            border-color: #800000;
        }

        .btn-export {
            background: #800000;
            color: white;
            border: none;
            font-weight: 500;
        }
        
        .btn-export:hover {
            background: #a00000;
        }

        /* Komponen Umum (Kotak/Card) */
        .section-box {
            background: white;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #222;
        }

        .section-subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }

        /* --- STYLING BERANDA --- */
        .welcome-box {
            background: linear-gradient(135deg, #800000, #b30000);
            color: white;
            padding: 40px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        .welcome-box h3 { font-size: 28px; margin-bottom: 10px; }
        .welcome-box p { font-size: 15px; opacity: 0.9; margin-bottom: 20px; }
        .btn-start-test {
            background-color: #ffd700;
            color: #800000;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        /* --- STYLING ASSESSMENT --- */
        .question-card {
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #fdfdfd;
        }
        .options-group {
            display: flex;
            gap: 15px;
            margin-top: 12px;
        }
        .option-label {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 1px solid #ddd;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            flex: 1;
        }

        /* --- STYLING TABEL LOG RIWAYAT --- */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: #800000;
            font-size: 13px;
            padding: 12px 15px;
            border-bottom: 2px solid #f0f0f0;
            text-transform: uppercase;
        }

        td {
            padding: 16px 15px;
            border-bottom: 1px solid #f5f5f5;
            font-size: 14px;
            vertical-align: middle;
        }

        .session-tag {
            display: block;
            font-size: 11px;
            color: #999;
            margin-top: 2px;
            text-transform: uppercase;
        }

        .score-badge {
            background-color: #800000;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
            margin-right: 8px;
        }

        .rekomendasi-wrapper {
            display: flex;
            align-items: center;
        }

        .btn-table-detail {
            background: transparent;
            border: 1px solid #800000;
            color: #800000;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-table-detail:hover {
            background: #800000;
            color: white;
        }

        /* --- SECTION INSIGHT & RECOMMENDATION --- */
        .insight-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .insight-card {
            border-radius: 12px;
            padding: 20px;
        }

        .insight-red {
            background-color: #fff5f5;
            border-left: 5px solid #800000;
        }

        .insight-yellow {
            background-color: #fffdf0;
            border-left: 5px solid #ffd700;
        }

        .insight-card h4 {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .insight-card p {
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }

        .insight-card ul {
            font-size: 13px;
            color: #555;
            padding-left: 18px;
            line-height: 1.8;
        }

        /* Footer */
        .footer-text {
            text-align: center;
            font-size: 11px;
            color: #aaa;
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }
    </style>
</head>
<script>
    document.addEventListener("DOMContentLoaded", function(){

    let riwayat =
        JSON.parse(localStorage.getItem("riwayatAssessment")) || [];

    let tabel =
        document.getElementById("riwayatTable");

    tabel.innerHTML = "";

    riwayat.forEach((item,index)=>{

        tabel.innerHTML += `
        <tr>
            <td>
                <strong>${item.tanggal}</strong>
                <span class="session-tag">
                    Sesi #${riwayat.length-index}
                </span>
            </td>

            <td>
                <div class="rekomendasi-wrapper">
                    <span class="score-badge">
                        ${item.skor}%
                    </span>
                    <strong>${item.rekom1}</strong>
                </div>
            </td>

            <td>${item.rekom2}</td>

            <td>${item.rekom3}</td>

            <td>
                <a href="#" class="btn-table-detail">
                    👁️ Detail Sesi
                </a>
            </td>
        </tr>
        `;
    });

});
</script>
<tbody id="riwayatTable">
    <tr>
        <div class="sidebar">
        <div class="logo-area">
            <h1>MATCH<br><span>Major</span></h1>
            <ul class="nav-links">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="assessment.html">Assessment</a></li>
            <li><a href="riwayatsesi.html" class="active">Riwayat Sesi</a></li>
            <li><a href="deskripsikarir.html">Deskripsi Karir</a></li>
            </ul>
        </div>

        <div class="user-area">
            <p>Alex Chandra</p>
            <span>Siswa Kelas XII</span>
            <button class="btn-logout">← Keluar</button>
        </div>
    </div>
        <td>
            <p class="footer-text">© 2026 Career Planner. Sistem Pendukung Keputusan Karir.</p>
</tbody>
    <script>
        const ctx = document.getElementById('careerChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['12 Jan 2026', '05 Feb 2026', '18 Mar 2026', '22 Apr 2026', '10 Mei 2026'],
                datasets: [
                    {
                        label: 'Top-1 Score',
                        data: [88, 85, 92, 90, 94],
                        borderColor: '#800000', /* Marun */
                        backgroundColor: 'transparent',
                        borderWidth: 3,
                        tension: 0.3,
                        pointBackgroundColor: '#800000'
                    },
                    {
                        label: 'Average Top-3',
                        data: [72, 74, 80, 83, 88],
                        borderColor: '#ffd700', /* Kuning */
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        tension: 0.3,
                        pointBackgroundColor: '#ffd700'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: { boxWidth: 12, font: { size: 12 } }
                    }
                },
                scales: {
                    y: {
                        min: 60,
                        max: 100,
                        ticks: { stepSize: 10 }
                    }
                }
            }
        });
    </script>
</body>
</html>
