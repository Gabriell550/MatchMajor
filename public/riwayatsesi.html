<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Sesi Asesmen - Eksplorasi Diri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fdfaf3; }
        .text-maroon { color: #7A1315; }
        .bg-maroon { background-color: #7A1315; }
    </style>
</head>

<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-5xl w-full mx-auto space-y-6">
<body class="p-4 md:p-8 flex justify-center min-h-screen">

        <a href="index.html" class="inline-flex items-center gap-2 text-sm font-bold text-maroon hover:text-red-900 bg-white border border-gray-100 px-4 py-2.5 rounded-xl shadow-sm transition-all">
            <i class="fa-solid fa-arrow-left text-xs"></i> Kembali ke Beranda
        </a>

        <header class="bg-white border border-gray-100 rounded-2xl px-6 py-4 shadow-sm flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-compass text-maroon text-xl"></i>
                <span class="font-extrabold text-gray-800 text-base">Eksplorasi Diri</span>
            </div>
            <nav class="flex items-center gap-6 text-sm font-semibold">
                <a href="index.html" class="text-gray-400 hover:text-gray-600">Beranda</a>
                <a href="#" class="text-maroon border-b-2 border-maroon">Riwayat</a>
            </nav>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white border border-gray-100 rounded-2xl p-5 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-red-50 flex items-center justify-center text-maroon"><i class="fa-solid fa-clipboard-list"></i></div>
                <div>
                    <p class="text-xs text-gray-500">Total Sesi</p>
                    <h3 id="totalSesi" class="text-xl font-bold">0</h3>
                </div>
            </div>
            <div class="bg-white border border-gray-100 rounded-2xl p-5 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-yellow-50 flex items-center justify-center text-yellow-600"><i class="fa-solid fa-star"></i></div>
                <div>
                    <p class="text-xs text-gray-500">Rekomendasi Utama</p>
                    <h3 id="topRekomendasi" class="text-sm font-bold truncate max-w-[150px]">-</h3>
                </div>
            </div>
            <div class="bg-white border border-gray-100 rounded-2xl p-5 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-green-50 flex items-center justify-center text-green-600"><i class="fa-solid fa-clock-rotate-left"></i></div>
                <div>
                    <p class="text-xs text-gray-500">Sesi Terakhir</p>
                    <h3 id="sesiTerakhir" class="text-sm font-bold">-</h3>
                </div>
            </div>
        </div>

        <div class="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <span class="text-xs font-bold text-gray-500 uppercase">Daftar Sesi</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-gray-400 text-xs font-bold uppercase">
                        <tr>
                            <th class="py-3 px-6">ID Sesi</th>
                            <th class="py-3 px-6">Tanggal</th>
                            <th class="py-3 px-6">Kekuatan</th>
                            <th class="py-3 px-6">Rekomendasi</th>
                            <th class="py-3 px-6 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable" class="text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_HISTORY_URL = "http://localhost:3000/result/history";
        let globalHistories = [];

        async function loadHistory() {
            try {
                const response = await fetch(API_HISTORY_URL);
                globalHistories = await response.json();
                
                document.getElementById("totalSesi").innerText = globalHistories.length;
                if (globalHistories.length > 0) {
                    document.getElementById("topRekomendasi").innerText = globalHistories[0].recommendation;
                    document.getElementById("sesiTerakhir").innerText = new Date(globalHistories[0].tanggal).toLocaleDateString("id-ID");
                }

                const tbody = document.getElementById("historyTable");
                tbody.innerHTML = globalHistories.map((item, index) => `
                    <tr class="border-b border-gray-50 hover:bg-gray-50">
                        <td class="py-4 px-6 font-semibold text-gray-600">#ED-${1000 + index}</td>
                        <td class="py-4 px-6 text-gray-500">${new Date(item.tanggal).toLocaleDateString("id-ID")}</td>
                        <td class="py-4 px-6"><span class="bg-gray-100 px-2 py-1 rounded-lg text-[10px] font-bold">${item.dominantStrength}</span></td>
                        <td class="py-4 px-6 font-bold text-maroon">${item.recommendation}</td>
                        <td class="py-4 px-6 text-center">
                            <button onclick="lihatHasil(${index})" class="bg-maroon text-white px-3 py-1 rounded-lg text-[10px] font-bold hover:bg-red-900">
                                BUKA HASIL
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                document.getElementById("historyTable").innerHTML = `<tr><td colspan="5" class="py-8 text-center text-red-500 font-bold">Gagal memuat data.</td></tr>`;
            }
        }

        function lihatHasil(index) {
            localStorage.setItem("assessmentResult", JSON.stringify(globalHistories[index]));
            window.location.href = "hasil.html";
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
