<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Match Major</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-maroon { background-color: #800000; }
        .text-maroon { color: #800000; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-96 border-t-4 border-maroon">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-maroon">Match Major</h1>
            <p class="text-gray-500 italic">Panel Admin Login</p>
        </div>

        <form action="admin.html" method="get">
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                <input type="text" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-maroon" placeholder="Masukkan username" required>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                <input type="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-maroon" placeholder="Masukkan password" required>
            </div>
            
            <button type="submit" class="w-full bg-maroon text-white py-3 rounded-lg font-bold hover:bg-red-900 transition-all">
                Masuk ke Dashboard
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm text-gray-400 hover:text-maroon transition-all underline">Kembali ke Beranda</a>
        </div>
    </div>

</body>
</html>
