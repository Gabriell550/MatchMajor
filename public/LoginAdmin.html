<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin | Match Major</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-[#800000] to-[#FFD700] flex items-center justify-center min-h-screen">
  <div class="glass-card p-10 rounded-3xl shadow-2xl w-full max-w-md text-center border border-white/20">
    <h1 class="text-4xl font-black text-gray-800 mb-4">Admin Login</h1>
    <form action="/api/auth/login" method="POST" class="space-y-5">
      <input name="identifier" type="text" required
        class="w-full px-4 py-3 border rounded-2xl focus:outline-none focus:ring-2 focus:ring-[#800000]"
        placeholder="Email atau username admin" />
      <input name="password" type="password" required
        class="w-full px-4 py-3 border rounded-2xl focus:outline-none focus:ring-2 focus:ring-[#800000]"
        placeholder="Password" />
      <button type="submit"
        class="w-full bg-[#800000] text-white py-3 rounded-2xl font-bold hover:bg-[#660000] transition-all">
        Masuk
      </button>
    </form>
    <a href="index.html" class="text-sm text-gray-400 mt-6 block hover:text-[#800000] transition font-semibold">Kembali ke Beranda</a>
  </div>
</body>
</html>
