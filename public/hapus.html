<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hapus Pertanyaan - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #fdfaf3;
      scroll-behavior: smooth;
    }

    .text-maroon {
      color: #7A1315;
    }

    .bg-maroon {
      background-color: #7A1315
    }

    .border-maroon {
      border-color: #7A1315
    }

    select {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 0.5rem center;
      background-repeat: no-repeat;
      background-size: 1.5em 1.5em;
    }

    .btn-danger {
      background-color: #b91c1c;
    }

    .btn-danger:hover {
      background-color: #991b1b;
    }
  </style>
</head>

<body class="p-4 md:p-8 flex items-center justify-center min-h-screen">
  <div class="max-w-4xl w-full mx-auto space-y-6">

    <div class="flex items-center">
      <a href="Admin.html"
        class="inline-flex items-center gap-2 text-sm font-bold text-maroon hover:text-red-900 bg-white border border-gray-100 px-4 py-2.5 rounded-xl shadow-sm transition-all">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard Admin
      </a>
    </div>

    <header id="main-nav"
      class="bg-white border border-gray-100 rounded-2xl px-6 py-4 shadow-sm flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-user-shield text-maroon text-xl"></i>
        <span class="font-extrabold text-gray-800 text-base tracking-tight">Admin Match Major</span>
      </div>
      <nav class="flex items-center gap-6 text-sm font-semibold">
        <a href="Admin.html" class="text-gray-400 hover:text-gray-600 transition-colors">Dashboard</a>
        <a href="#" class="text-maroon border-b-2 border-maroon pb-0.5">Hapus Soal</a>
      </nav>
    </header>

    <div class="bg-white border border-gray-100 rounded-2xl p-6 md:p-8 shadow-md space-y-6">
      <div class="flex items-center gap-3 pb-4 border-b border-gray-100">
        <i class="fa-solid fa-trash-can text-2xl text-maroon"></i>
        <h3 class="text-2xl font-bold text-maroon">Hapus Pertanyaan</h3>
      </div>

      <div class="space-y-4">
        <div class="bg-red-50 border border-red-100 rounded-xl p-4">
          <div class="flex items-start gap-3">
            <i class="fa-solid fa-triangle-exclamation text-red-700 mt-0.5"></i>
            <div>
              <p class="font-bold text-red-800">Peringatan!</p>
              <p class="text-sm text-red-900/80">
                Menghapus pertanyaan akan menghilangkan data dari database. Pastikan pilih pertanyaan yang benar.
              </p>
            </div>
          </div>
        </div>

        <div class="flex flex-col md:flex-row md:items-end gap-4">
          <div class="flex-1 space-y-2">
            <label for="filter-trait" class="block font-bold text-gray-700">Kategori RIASEC</label>
            <select id="filter-trait" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-maroon focus:ring-2 focus:ring-red-900/20 outline-none transition-all text-gray-700 appearance-none pr-10">
              <option value="" disabled selected>-- Pilih Kategori --</option>
              <option value="R">Realistic (R)</option>
              <option value="I">Investigative (I)</option>
              <option value="A">Artistic (A)</option>
              <option value="S">Sosial (S)</option>
              <option value="E">Enterprising (E)</option>
              <option value="C">Conventional (C)</option>
            </select>
          </div>

          <div class="flex-1 space-y-2">
            <label for="search-box" class="block font-bold text-gray-700">Pencarian</label>
            <input id="search-box" type="text" placeholder="Cari teks pertanyaan..."
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-maroon focus:ring-2 focus:ring-red-900/20 outline-none transition-all text-gray-700" oninput="renderTable()" />
          </div>
        </div>

        <table class="w-full border-collapse overflow-hidden rounded-xl border border-gray-100">
          <thead>
            <tr class="bg-gray-50">
              <th class="px-4 py-3 text-left text-xs font-bold text-gray-500" style="width:70px;">No</th>
              <th class="px-4 py-3 text-left text-xs font-bold text-gray-500">Pertanyaan</th>
              <th class="px-4 py-3 text-left text-xs font-bold text-gray-500" style="width:160px;">Trait</th>
              <th class="px-4 py-3 text-left text-xs font-bold text-gray-500" style="width:140px;">Aksi</th>
            </tr>
          </thead>
          <tbody id="question-table-body">
            <tr>
              <td colspan="4" class="px-4 py-6 text-center text-gray-400">Memuat data pertanyaan...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="flex items-center justify-end gap-3 pt-2 border-t border-gray-100">
        <a href="tambah.html" class="bg-gray-100 text-gray-700 px-5 py-3 rounded-xl font-bold hover:bg-gray-200 transition-all shadow-sm">Tambah Soal</a>
        <a href="edit.html" class="bg-gray-100 text-gray-700 px-5 py-3 rounded-xl font-bold hover:bg-gray-200 transition-all shadow-sm">Edit Soal</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:3000";

    let questions = [];

    const traitLabel = {
      R: "Realistic (R)",
      I: "Investigative (I)",
      A: "Artistic (A)",
      S: "Social (S)",
      E: "Enterprising (E)",
      C: "Conventional (C)"
    };

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.innerText = str ?? "";
      return div.innerHTML;
    }

    async function loadQuestions() {
      try {
        const res = await fetch(`${API_URL}/questions`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        questions = data.data || data;

        renderTable();
      } catch (err) {
        console.error(err);
        document.getElementById("question-table-body").innerHTML =
          `<tr><td colspan="4" class="px-4 py-6 text-center text-red-700">Gagal memuat data pertanyaan dari server.</td></tr>`;
      }
    }

    function renderTable() {
      const tbody = document.getElementById("question-table-body");
      const traitFilterEl = document.getElementById("filter-trait");
      const traitFilter = traitFilterEl ? traitFilterEl.value : "";
      const search = (document.getElementById("search-box")?.value || "").toLowerCase();

      const filtered = questions.filter(q => {
        const matchTrait = !traitFilter || q.trait === traitFilter;
        const matchSearch = !search || (q.question || "").toLowerCase().includes(search);
        return matchTrait && matchSearch;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-6 text-center text-gray-400">Tidak ada pertanyaan yang cocok.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((q, index) => {
        const traitText = traitLabel[q.trait] || q.trait || "-";
        return `
          <tr class="border-t border-gray-100">
            <td class="px-4 py-3">${index + 1}</td>
            <td class="px-4 py-3">${escapeHtml(q.question)}</td>
            <td class="px-4 py-3"><span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-gray-100 text-gray-700">${escapeHtml(traitText)}</span></td>
            <td class="px-4 py-3">
              <button
                type="button"
                class="btn-danger text-white px-4 py-2 rounded-xl font-bold text-sm shadow-sm hover:btn-danger"
                onclick="confirmDelete('${q._id}', ${index})">
                Hapus
              </button>
            </td>
          </tr>
        `;
      }).join("");
    }

    window.confirmDelete = async function confirmDelete(id) {
      const q = questions.find(x => x._id === id);
      const preview = q?.question ? `\n\n"${q.question}"` : "";

      const ok = confirm(`Yakin ingin menghapus pertanyaan?${preview}`);
      if (!ok) return;

      try {
        const res = await fetch(`${API_URL}/questions/${id}`, {
          method: "DELETE"
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        alert("Pertanyaan berhasil dihapus.");
        await loadQuestions();
      } catch (err) {
        console.error(err);
        alert("Gagal menghapus pertanyaan.");
      }
    }

    loadQuestions();
  </script>
</body>

</html>
