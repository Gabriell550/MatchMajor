<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Match Major</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-96 text-center">
        <h2 class="text-2xl font-bold mb-6">Masuk ke Match Major</h2>
        <button id="google-login" class="w-full bg-blue-600 text-white py-2 rounded flex items-center justify-center gap-2 hover:bg-blue-700 transition">
            Login dengan Google
        </button>
        <a href="index.html" class="text-sm text-gray-500 mt-4 block hover:underline">Kembali ke Beranda</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA0TKujQ_u9GU9eFJelMuo_ykXA1T0063c",
            authDomain: "matchmajor-78a97.firebaseapp.com",
            projectId: "matchmajor-78a97",
            storageBucket: "matchmajor-78a97.firebasestorage.app",
            messagingSenderId: "113944926778",
            appId: "1:113944926778:web:0d4fc483d51fc5640e7303"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        document.getElementById('google-login').addEventListener('click', () => {
            auth.signInWithPopup(provider)
                .then(() => {
                    window.location.href = 'assessment.html';
                })
                .catch((error) => {
                    console.error("DEBUG LOGIN:", error.code, error.message);
                    alert("Login Gagal: " + error.message + "\n\nCek Console (F12) untuk detail.");
                });
        });
    </script>
</body>
</html>
